services:
  mongo:
    image: mongo:7
    container_name: startup-simulator-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: startup-simulator-backend
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: startup_simulator
      CHROMA_PERSIST_DIR: /app/chroma_data
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ../backend:/app
      - chroma_data:/app/chroma_data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: startup-simulator-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      # Anonymous volume shadows the bind mount above for this one path, so the
      # image's own Linux-built node_modules isn't overwritten by the host's
      # (e.g. Windows/macOS) node_modules, which lacks the right native binaries.
      - /app/node_modules

  test:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: startup-simulator-test
    profiles: ["test"]
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: startup_simulator_test
      CHROMA_PERSIST_DIR: /app/chroma_data
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DEBUG: "true"
    volumes:
      - ../backend:/app
    command: python -m pytest -q

volumes:
  mongo_data:
  chroma_data:
