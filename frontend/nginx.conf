server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public walkthrough assets: allow native byte-range seeking and short cache reuse.
    location /media/ {
        try_files $uri =404;
        types { video/mp4 mp4; text/vtt vtt; image/jpeg jpg; }
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
