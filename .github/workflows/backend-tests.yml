name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_INTEGRATION_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd backend
          pytest

      - name: Warm and evaluate the 50-case synthetic knowledge corpus
        run: |
          cd backend
          PYTHONPATH=. python scripts/warm_knowledge_models.py
          PYTHONPATH=. python scripts/evaluate_knowledge.py --require-hybrid --min-pass 49 --output /tmp/knowledge-evaluation.json
      - name: Save retrieval evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-evaluation
          path: /tmp/knowledge-evaluation.json
