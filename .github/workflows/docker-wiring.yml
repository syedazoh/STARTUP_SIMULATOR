name: Docker Compose Wiring

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'web/**'
      - '.dockerignore'
      - 'docker-compose.next.yml'
      - 'Jenkinsfile'
      - 'scripts/check_worker_permissions.py'
      - 'scripts/smoke_next_release.py'
      - 'docker/**'
      - 'scripts/smoke_stack.py'
      - '.github/workflows/docker-wiring.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'web/**'
      - '.dockerignore'
      - 'docker-compose.next.yml'
      - 'Jenkinsfile'
      - 'scripts/check_worker_permissions.py'
      - 'scripts/smoke_next_release.py'
      - 'docker/**'
      - 'scripts/smoke_stack.py'
      - '.github/workflows/docker-wiring.yml'

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the isolated development stack
        run: docker compose -p startup-wiring -f docker/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Check HTTP wiring, approvals and database writes
        run: python scripts/smoke_stack.py before-restart --state-file "$RUNNER_TEMP/startup-wiring.json"
      - name: Restart backend and verify persistence and session lifecycle
        run: |
          docker compose -p startup-wiring -f docker/docker-compose.yml restart backend
          python scripts/smoke_stack.py after-restart --state-file "$RUNNER_TEMP/startup-wiring.json"
      - name: Logs and isolated test cleanup
        if: always()
        run: |
          docker compose -p startup-wiring -f docker/docker-compose.yml logs --tail 100
          docker compose -p startup-wiring -f docker/docker-compose.yml down -v
          rm -f "$RUNNER_TEMP/startup-wiring.json"

  next-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Next from web-only dependencies and shared sources
        run: docker build -f web/Dockerfile -t startup-next:${{ github.sha }} .
      - name: Verify unprivileged runtime and per-request CSP
        run: |
          docker run -d --name next-image -p 127.0.0.1:3030:3000 startup-next:${{ github.sha }}
          python - <<'PYTHON'
          import time, urllib.request
          for attempt in range(30):
              try:
                  first = urllib.request.urlopen('http://127.0.0.1:3030/login', timeout=3)
                  assert first.status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Next container did not become ready')
          second = urllib.request.urlopen('http://127.0.0.1:3030/login', timeout=3)
          a, b = first.headers['Content-Security-Policy'], second.headers['Content-Security-Policy']
          assert "'nonce-" in a and a != b
          assert 'private' in second.headers['Cache-Control']
          PYTHON
          test "$(docker inspect --format '{{.Config.User}}' next-image)" = node
      - name: Verify isolated worker database authority and Mongo restore
        run: |
          python -m pip install pymongo==4.8.0
          python scripts/check_worker_permissions.py
      - name: Local runtime cleanup
        if: always()
        run: docker logs next-image; docker rm -f next-image
